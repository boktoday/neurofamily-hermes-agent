# NeuroFamily Support Ecosystem - example Hermes configuration.
# No credentials included. After copying this into your profile, set your
# provider key in .env (see .env.example), or run `hermes setup`.
#
# Model strategy: DeepSeek Flash via OpenRouter is the everyday default.
# For complex jobs switch up to a frontier model on the same key; for the
# scheduled check-ins a small local model (LM Studio / Ollama) is encouraged.
# Full strategy, voice setup and the offline story: docs/models.md.
#
# OpenRouter is a routing aggregator, so model ids are vendor-namespaced:
# `deepseek/deepseek-v4-flash`. OpenRouter does also resolve the bare
# `deepseek-v4-flash` today, but that alias is not in the published model
# catalogue and can be retired without notice, so the namespaced id is the
# durable one. For any other model, copy the exact id from
# https://openrouter.ai/models or `curl https://openrouter.ai/api/v1/models`.
_config_version: 33
model:
  default: deepseek/deepseek-v4-flash
  provider: openrouter
# ---------------------------------------------------------------------------
# Voice. Every spoken reply also carries a 1-2 line written summary, because
# someone in a loud kitchen or in auditory overload must not have to press play
# to find out whether it matters.
#
# tts:
#   provider: piper              # local, so the audio never leaves the machine
#   voice: en_GB-alba-medium     # steady pitch reads better than a lively one
#   speed: 1.0                   # 1.0x to 1.35x; slower is not automatically kinder
#
# Per-person voices and rates belong in ~/neurofamily/family-profile.md, not
# here, because they differ per person and a household default is usually wrong
# for at least one of them. Above roughly 1.35x the words start to blur for
# people with auditory processing differences; below about 0.9x it starts to
# sound patronising. Ask once, write the answer down, stop asking.
# ---------------------------------------------------------------------------
compression:
  enabled: true
  threshold: 0.85
  target_ratio: 0.7
  protect_last_n: 50
  protect_first_n: 3
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true
  memory_char_limit: 1100
  user_char_limit: 700
onboarding:
  profile_build: ask
  seen: {}
# ---------------------------------------------------------------------------
# Slash commands are native Hermes skill bundles, not a plugin: run
# `python scripts/setup_commands.py` to install one per skill into this
# profile's skill-bundles/ directory. Nothing needs enabling here.
# ---------------------------------------------------------------------------
platforms:
  api_server:
    enabled: false
  telegram:
    enabled: false
