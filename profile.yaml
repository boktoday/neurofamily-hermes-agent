description: 'NeuroFamily Support Ecosystem - twelve specialist support skills for families
  raising neurodiverse children. A shared family folder keeps every skill on the same
  page, with optional scheduled check-ins through Hermes cron and optional Google or
  Microsoft calendar, mail, task and file connections via Maton. Built for a WhatsApp
  shared family group (Telegram works too). Strengths-based, neurodiversity-affirming
  and trauma-informed, with hard escalation rails to human professionals. Runs fully
  offline with local models if the family prefers.'
